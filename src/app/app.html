<div class="min-h-screen bg-neutral-900 text-white">
  <!-- Navbar Fijo -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-neutral-900/90 backdrop-blur-sm border-b border-neutral-800">
    <div class="nav-links max-w-5xl mx-auto px-6 py-4 flex justify-center items-center gap-8">
      <a href="#experiencia" class="text-sm text-neutral-300 hover:text-white transition-colors">Experiencia</a>
      <a href="#proyectos" class="text-sm text-neutral-300 hover:text-white transition-colors">Proyectos</a>
      <a href="#tecnologias" class="text-sm text-neutral-300 hover:text-white transition-colors">Tecnologías</a>
      <a href="#sobre-mi" class="text-sm text-neutral-300 hover:text-white transition-colors">Sobre mí</a>
      <a href="#contacto" class="text-sm text-neutral-300 hover:text-white transition-colors">Contacto</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="pt-20">
    <app-hero />
    <app-experience />
    <app-projects />
    <app-technologies />
    <app-about />
    <app-contact />
  </main>

  <!-- Footer: extra bottom padding on mobile so the fixed back-to-top
       button never covers the copyright text -->
  <footer class="py-8 pb-24 sm:pb-8 text-center text-neutral-300 border-t border-neutral-800">
    <p class="text-sm">© {{ currentYear }} Portafolio. Todos los derechos reservados.</p>
  </footer>

  <!-- Back-to-top: visibility driven by scroll-state queries (styles.css) -->
  <a
    href="#inicio"
    class="back-to-top"
    aria-label="Volver al inicio"
    (focusout)="onBackToTopFocusOut($event)"
  >
    <svg
      class="w-5 h-5"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m5 12 7-7 7 7" />
      <path d="M12 19V5" />
    </svg>
  </a>
</div>
