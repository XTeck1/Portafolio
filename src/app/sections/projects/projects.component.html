<section id="proyectos" tabindex="-1" class="py-24 px-6">
  <div class="max-w-4xl mx-auto">
    <h2 class="text-3xl font-bold text-white mb-12 text-center">Proyectos</h2>
    <div class="grid gap-6 md:grid-cols-2">
      @for (proyecto of proyectos; track proyecto.titulo) {
        <div class="bg-neutral-800 border border-neutral-700 rounded-lg p-6 shadow-sm hover:shadow-md transition-shadow">
          <h3 class="text-xl font-semibold text-white mb-2">{{ proyecto.titulo }}</h3>
          <p class="text-neutral-300 mb-4">{{ proyecto.descripcion }}</p>
          <div class="flex flex-wrap gap-2 mb-4">
            @for (tech of proyecto.tecnologias; track tech) {
              <span class="px-2 py-1 text-xs bg-neutral-700 text-neutral-300 rounded">{{ tech }}</span>
            }
          </div>
          @if (proyecto.enlace) {
            <a [href]="proyecto.enlace" class="text-orange-500 hover:text-orange-400 hover:underline text-sm">Ver proyecto →</a>
          }
        </div>
      }
    </div>
  </div>
</section>
