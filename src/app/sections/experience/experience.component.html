<section id="experiencia" tabindex="-1" class="py-24 px-6">
  <div class="max-w-3xl mx-auto">
    <h2 class="reveal text-3xl font-bold text-white mb-12 text-center">Experiencia</h2>
    <div class="space-y-8">
      @for (exp of experiencia; track exp.cargo) {
        <div class="reveal border-l-2 border-orange-500 pl-6">
          <span class="text-sm text-neutral-300">{{ exp.periodo }}</span>
          <h3 class="text-xl font-semibold text-white">{{ exp.cargo }}</h3>
          <p class="text-neutral-300 mb-2">{{ exp.empresa }}</p>
          <p class="text-neutral-300">{{ exp.descripcion }}</p>
        </div>
      }
    </div>
  </div>
</section>
