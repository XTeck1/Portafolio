<section id="contacto" tabindex="-1" class="py-24 px-6">
  <div class="max-w-2xl mx-auto text-center">
    <h2 class="text-3xl font-bold text-white mb-8">Contacto</h2>
    <p class="text-neutral-300 mb-8">¿Interesado en trabajar juntos? Escríbeme un correo.</p>
    <a [href]="'mailto:' + email" class="inline-block px-6 py-3 bg-orange-500 text-neutral-900 rounded-lg font-medium hover:bg-orange-400 transition-colors">Enviar correo</a>
  </div>
</section>
