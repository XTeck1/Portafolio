
name: Deploy Angular Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npx ng build --configuration production --base-href /Portafolio/

      - name: Prepare GitHub Pages
        id: build
        run: |
          INDEX_FILE=$(find dist -name index.html -type f -print -quit)

          if [ -z "$INDEX_FILE" ]; then
            echo "No se encontró index.html dentro de dist"
            exit 1
          fi

          OUTPUT_DIR=$(dirname "$INDEX_FILE")
          cp "$OUTPUT_DIR/index.html" "$OUTPUT_DIR/404.html"

          echo "directory=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.build.outputs.directory }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
